<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<title>Sound &amp; Hearing Quest</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--b1:#0fa3b1;--b2:#3d6bf0;--b3:#8a4dd8;--card:#fff;--tx:#25203a;--mut:#6b6485;--pri:#ff3d8b;--pri2:#6a3df0;--ok:#12a150;--okbg:#dff7e8;--no:#e03131;--nobg:#ffe3e3;--bd:#e6dcf5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--b1:#2b1a6e;--b2:#7a1f57;--b3:#8a4a12;--card:#2a2240;--tx:#f5eefc;--mut:#bdb2d0;--okbg:#14402880;--nobg:#4d1f2680;--bd:#41355c;--ok:#4fd48a;--no:#ff8080}}
:root[data-theme="dark"]{--b1:#2b1a6e;--b2:#7a1f57;--b3:#8a4a12;--card:#2a2240;--tx:#f5eefc;--mut:#bdb2d0;--okbg:#14402880;--nobg:#4d1f2680;--bd:#41355c;--ok:#4fd48a;--no:#ff8080}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:linear-gradient(160deg,var(--b1),var(--b2) 55%,var(--b3)) fixed;color:var(--tx);font:17px/1.45 "Fredoka","Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px 14px 40px}
h1{font-size:34px;line-height:1.1;margin:10px 0;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.18)}
main>h2{color:#fff;font-size:26px;margin:8px 0 2px;text-shadow:0 2px 0 rgba(0,0,0,.18)}
.card h2{font-size:21px;margin:4px 0;color:var(--tx)}
.hero{text-align:center;padding:14px 0 4px}.hero .em{font-size:64px;display:inline-block;animation:bob 2.4s ease-in-out infinite}.hero p{color:#fff;opacity:.92;margin:0 0 6px}
.tags{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:8px 0 4px}.tags span{background:rgba(255,255,255,.22);color:#fff;padding:4px 11px;border-radius:99px;font-size:14px;backdrop-filter:blur(4px)}
.card{background:var(--card);border-radius:22px;padding:16px;margin:14px 0;box-shadow:0 8px 0 rgba(0,0,0,.14),0 14px 28px rgba(0,0,0,.14);animation:rise .35s ease both}
.mut{color:var(--mut);font-size:15px}
.chip{display:inline-block;background:rgba(255,255,255,.25);color:#fff;border-radius:99px;padding:5px 13px;font-size:15px;margin:0}
.intro{color:#fff;opacity:.95;margin:2px 0 6px}
input{width:100%;font:inherit;font-size:19px;padding:13px 14px;border-radius:16px;border:3px solid var(--bd);background:var(--card);color:var(--tx);margin:10px 0;outline:0}input:focus{border-color:var(--pri2)}
.btn{display:block;width:100%;font:inherit;font-weight:700;font-size:18px;padding:14px;border:0;border-radius:16px;background:linear-gradient(135deg,#ff3d8b,#ff7a45);color:#fff;cursor:pointer;margin-top:12px;box-shadow:0 5px 0 rgba(0,0,0,.2);transition:transform .1s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.2)}
.btn.alt{background:linear-gradient(135deg,#6a3df0,#3d8bff)}.btn:disabled{opacity:.45}
.opt{display:block;width:100%;text-align:left;font:inherit;color:var(--tx);background:var(--card);border:3px solid var(--bd);border-radius:16px;padding:11px 14px;margin:8px 0;cursor:pointer;transition:transform .1s,border-color .1s}
.opt:not(:disabled):hover{border-color:var(--pri2);transform:translateX(3px)}
.opt.ok{background:var(--okbg);border-color:var(--ok);animation:pop .35s}.opt.no{background:var(--nobg);border-color:var(--no);animation:shake .35s}
.q{font-weight:700;font-size:18px;margin-bottom:4px}.fb{font-size:15px;font-weight:600}
.bar{height:14px;background:rgba(255,255,255,.28);border-radius:9px;overflow:hidden;margin:10px 0 14px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#ffe66d,#ffffff);border-radius:9px;transition:width .4s}
.w{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:15px}td,th{padding:8px 10px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
textarea{width:100%;height:90px;font:14px monospace;border-radius:12px;border:3px solid var(--bd);background:var(--card);color:var(--tx);padding:8px}
.big{font-size:70px;text-align:center;animation:pop .6s}
.how{background:var(--card);border-radius:18px;padding:12px 14px;margin:10px 0;border-left:8px solid #ffc83d;box-shadow:0 5px 0 rgba(0,0,0,.12);animation:rise .35s ease both}.how .ex{margin-top:6px;font-size:15px;background:var(--bd);border-radius:10px;padding:6px 10px}
.cf{position:fixed;top:-40px;z-index:9;pointer-events:none;animation:fall linear forwards}
@keyframes bob{50%{transform:translateY(-8px) rotate(-6deg)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@keyframes pop{50%{transform:scale(1.04)}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head>
<body>
<main id="app"></main>
<script>
var FORM_LINK=""; /* вариант 1 (проще): ссылка «предварительно заполненная» из Google Формы */
var ACT="p38";
var SHEET_URL=""; /* вариант 2: ссылка Apps Script */ /* вставьте сюда ссылку Google Apps Script (см. инструкцию) */
var SECS=[
{t:"1. Sound facts 🔊",i:"Is the sentence true or false?",fix:1,o:["True","False"],h:["Read the sentence. If it is correct, tap True. If not, tap False. Use page 38.","Прочитай предложение. Если оно верное, нажми True, если нет, нажми False. Смотри стр. 38.","Sound is a kind of food. → False"],f:"Sound travels about 4 times faster through water than through air!",q:[
["Sound travels in waves.",0],["Our ears and brain work together so we can hear.",0],["Sound can travel through air, liquid and solid materials.",0],["Cats, rabbits and horses don’t hear as well as people.",1],["Sound travels faster through water than through air.",0],["The part of the ear that we can see is the outer ear.",0]]},
{t:"2. Ear journey 👂",i:"What happens in each step? Follow the sound!",h:["Sound travels through the ear step by step. Choose what happens in each step (text on page 38).","Звук проходит через ухо шаг за шагом. Выбери, что происходит на каждом шаге (текст на стр. 38).","Step 1: Sound waves hit our eardrum."],f:"The stirrup is the smallest bone in your whole body!",q:[
["Step 1: What happens first?",["Sound waves hit our eardrum.","The nerves send signals to our brain.","The liquid in the cochlea moves the nerves."]],
["Step 2: What happens next?",["The little bones start moving.","Sound enters the cochlea.","The nerves send signals to our brain."]],
["Step 3: What happens next?",["Sound enters the cochlea.","Sound waves hit our eardrum.","The little bones start moving."]],
["Step 4: What happens next?",["The liquid in the cochlea moves the nerves.","Sound waves hit our eardrum.","The little bones start moving."]],
["Step 5: What happens last?",["The nerves send signals to our brain.","Sound waves hit our eardrum.","Sound enters the cochlea."]]]},
{t:"3. Parts of the ear 🦴",i:"Label the ear: choose the correct part.",h:["Read the clue and choose the name of the part of the ear. Look at the diagram on page 38.","Прочитай подсказку и выбери название части уха. Смотри схему на стр. 38.","A small bone that starts with H → hammer"],f:"Your cochlea is curled like a snail shell and is only about the size of a pea.",q:[
["The part of the ear that we can see",["outer ear","cochlea","hammer"]],
["Sound waves hit this and it vibrates",["eardrum","stirrup","nerve"]],
["The three little bones are the hammer, the anvil and the …",["stirrup","cochlea","ear canal"]],
["A small, curled tube that looks like a snail shell",["cochlea","eardrum","anvil"]],
["Sound waves go through this on the way to the eardrum",["ear canal","outer ear","hammer"]]]},
{t:"4. Sound words 📖",i:"Choose the word that matches the meaning.",h:["Read the meaning and choose the word from the text.","Прочитай значение и выбери слово из текста.","A place where you buy books → bookshop"],f:"Cats can hear much higher sounds than people can.",q:[
["To move quickly back and forth, like an eardrum",["vibrate","collect","create"]],
["Water is a … , not a solid or a gas",["liquid","bone","tube"]],
["A very small part of the body that sends messages to the brain",["nerve","horn","bump"]],
["A loud sound a car makes to warn people",["horn","tube","nerve"]],
["To hit something gently, like the little bones do",["bump","enter","collect"]]]}
];
var MAX=SECS.reduce(function(a,s){return a+s.q.length},0);
var name="",si=0,scores=[],done=0,sc=0;
var app=document.getElementById("app");
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function total(){return scores.reduce(function(a,b){return a+(b||0)},0)}
function grade(n){return Math.max(1,Math.round(n/MAX*10))}
function jsonp(u,cb){var f="cb"+Date.now(),s=document.createElement("script");window[f]=function(d){cb(d);delete window[f];s.remove()};s.src=u+"&callback="+f;s.onerror=function(){cb(null)};document.head.appendChild(s)}
function send(){
 var t=total(),nm=name.replace(/[<>]/g,"");
 if(FORM_LINK){var en=FORM_LINK.match(/entry\.\d+/g)||[],v=[nm,t+"/"+MAX,String(grade(t)),ACT+": "+scores.join(",")],b=new URLSearchParams();
  en.slice(0,4).forEach(function(k,i){b.append(k,v[i])});
  return fetch(FORM_LINK.split("?")[0].replace("/viewform","/formResponse"),{method:"POST",mode:"no-cors",body:b}).then(function(){return"ok"},function(){return"err"})}
 if(!SHEET_URL)return Promise.resolve("none");
 var d={name:nm,scores:scores,total:t,max:MAX,grade:grade(t)};
 return fetch(SHEET_URL+"?action=add&data="+encodeURIComponent(JSON.stringify(d)),{mode:"no-cors"}).then(function(){return"ok"},function(){return"err"})}
function enc(s){return btoa(unescape(encodeURIComponent(s))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}
function dec(s){s=s.replace(/-/g,"+").replace(/_/g,"/");while(s.length%4)s+="=";return decodeURIComponent(escape(atob(s)))}
function chk(s){var h=7;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))%99991;return h.toString(36)}
function mkCode(){var p=enc(name.replace(/\|/g," ")+"|"+scores.join(",")+"|"+Math.floor(Date.now()/60000));return"EQ."+p+"."+chk(p)}
function parseCode(c){var m=String(c).trim().match(/^EQ\.([\w-]+)\.(\w+)$/);if(!m||chk(m[1])!==m[2])return null;try{var a=dec(m[1]).split("|"),sc=a[1].split(",").map(Number);if(sc.length!==SECS.length||sc.some(function(v,i){return!(v>=0&&v<=SECS[i].q.length)}))return null;return{name:a[0],scores:sc,t:+a[2]*60000}}catch(e){return null}}
function store(){try{return JSON.parse(localStorage.getItem("eq_res38")||"[]")}catch(e){return[]}}
function put(a){try{localStorage.setItem("eq_res38",JSON.stringify(a))}catch(e){}}

function localTab(){
 app.innerHTML='<h1>👩‍🏫 Teacher tab</h1><div class="card"><b>Paste student codes</b> <span class="mut">(one per line)</span><textarea id="in" placeholder="EQ.xxxx.yy"></textarea><button class="btn" id="add">Add to table</button><div class="mut" id="msg"></div></div><div class="card"><div class="w" id="tb"></div></div><button class="btn alt" id="bk">← Back</button><button class="btn alt" id="clr" style="background:#8a8296">🗑 Clear table</button>';
 var tb=document.getElementById("tb"),msg=document.getElementById("msg");
 function draw(){var r=store().sort(function(a,b){return String(a.name).localeCompare(String(b.name))});
  if(!r.length){tb.textContent="No results yet. Paste codes above.";return}
  tb.innerHTML='<table><tr><th>Name</th>'+SECS.map(function(x,i){return"<th>"+(i+1)+"</th>"}).join("")+'<th>Total</th><th>Grade /10</th></tr>'+
  r.map(function(x){var n=x.scores.reduce(function(a,b){return a+b},0);return"<tr><td>"+esc(x.name)+"</td>"+x.scores.map(function(v){return"<td>"+v+"</td>"}).join("")+"<td><b>"+n+"/"+MAX+"</b></td><td><b>"+grade(n)+"</b></td></tr>"}).join("")+"</table>"}
 document.getElementById("add").onclick=function(){
  var lines=document.getElementById("in").value.split(/\s+/).filter(Boolean),ok=0,bad=0,a=store();
  lines.forEach(function(l){var p=parseCode(l);if(!p){bad++;return}
   a=a.filter(function(x){return x.name!==p.name||x.t>p.t});if(!a.some(function(x){return x.name===p.name&&x.t>=p.t}))a.push(p);ok++});
  put(a);document.getElementById("in").value="";msg.textContent="Added: "+ok+(bad?" · not recognised: "+bad:"");draw()};
 var cl=document.getElementById("clr"),armed=0;
 cl.onclick=function(){if(!armed){armed=1;cl.textContent="Tap again to delete everything";setTimeout(function(){armed=0;cl.textContent="🗑 Clear table"},4000)}else{put([]);armed=0;cl.textContent="🗑 Clear table";draw()}};
 document.getElementById("bk").onclick=home;draw();
}
function confetti(){if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;var e=["🎉","⭐","🎧","✨","🏆","🎤"];for(var i=0;i<36;i++){var x=document.createElement("span");x.className="cf";x.textContent=e[i%e.length];x.style.left=Math.random()*100+"vw";x.style.fontSize=(18+Math.random()*20)+"px";x.style.animationDuration=(2.5+Math.random()*2.5)+"s";x.style.animationDelay=Math.random()*.8+"s";document.body.appendChild(x);setTimeout(function(n){n.remove()},6000,x)}}
function teacher(){if(SHEET_URL)return sheetTab();if(!FORM_LINK)return localTab();
 app.innerHTML='<h1>👩‍🏫 Teacher tab</h1><div class="card"><h2>Results are in your Google Form</h2><p class="mut">Open your form in Google Forms → tab “Responses” (or “View in Sheets”). You will see: name, score, grade /10 and points per level.</p></div><button class="btn alt" id="bk">← Back</button>';document.getElementById("bk").onclick=home}
function sheetTab(){
 app.innerHTML='<h1>👩‍🏫 Teacher tab</h1><div class="card"><b>Teacher PIN</b><input id="pin" type="password" placeholder="PIN"><button class="btn" id="ld">Show results</button></div><div class="card"><div class="w" id="tb">Enter your PIN.</div></div><button class="btn alt" id="bk">← Back</button>';
 document.getElementById("bk").onclick=home;var tb=document.getElementById("tb");
 document.getElementById("ld").onclick=function(){tb.textContent="Loading…";
  jsonp(SHEET_URL+"?key="+encodeURIComponent(document.getElementById("pin").value),function(d){
   if(!d){tb.textContent="Could not load. Check SHEET_URL.";return}
   if(d.error){tb.textContent="Wrong PIN.";return}
   var m={};d.forEach(function(r){if(r.name)m[r.name]=r});var r=Object.keys(m).map(function(k){return m[k]}).sort(function(a,b){return a.name.localeCompare(b.name)});
   if(!r.length){tb.textContent="No results yet.";return}
   tb.innerHTML='<table><tr><th>Name</th><th>Total</th><th>Grade /10</th>'+SECS.map(function(x,i){return"<th>"+(i+1)+"</th>"}).join("")+'<th>Time</th></tr>'+
   r.map(function(x){var s=String(x.scores).split(",");return"<tr><td>"+esc(x.name)+"</td><td><b>"+x.total+"/"+x.max+"</b></td><td><b>"+x.grade+"</b></td>"+SECS.map(function(_,i){return"<td>"+(s[i]||"–")+"</td>"}).join("")+"<td>"+esc(String(x.t).slice(11,16))+"</td></tr>"}).join("")+"</table>"})}}
function home(){
 app.innerHTML='<div class="hero"><div class="em">🎧</div><h1>Sound & Hearing Quest</h1><p>How do we hear?</p><div class="tags"><span>Module 3</span><span>3f Across the Curriculum</span><span>page 38</span></div></div><div class="card"><h2>Ready to play? 🚀</h2><p class="mut">'+SECS.length+' quick levels · '+MAX+' questions · get as many ⭐ as you can!</p><div class="mut" style="margin:6px 0">1️⃣ Write your name<br>2️⃣ Read “What to do” in every level<br>3️⃣ Tap one answer (only one try!)<br>4️⃣ Green ✅ = correct, red ❌ = wrong<br>5️⃣ Press Next when you finish</div>'+
 '<label for="n"><b>What’s your name?</b></label><input id="n" placeholder="Name Surname" maxlength="40" autocomplete="off"><button class="btn" id="go" disabled>Let’s go! ▶</button></div>'+
 '<button class="btn alt" id="tt" style="background:rgba(255,255,255,.22);font-size:15px;box-shadow:none">👩‍🏫 Teacher tab</button>';
 var n=document.getElementById("n"),g=document.getElementById("go");
 n.oninput=function(){g.disabled=n.value.trim().length<2};
 g.onclick=function(){name=n.value.trim();si=0;scores=[];sec()};
 document.getElementById("tt").onclick=teacher;
}
function sec(){
 var S=SECS[si];done=0;sc=0;
 var h='<p class="chip">👤 '+esc(name)+' · ⭐ '+total()+'/'+MAX+'</p><div class="bar"><i style="width:'+(si/SECS.length*100)+'%"></i></div><h2>'+S.t+'</h2><p class="intro">'+S.i+'</p><div class="how"><b>📝 What to do</b><br>'+S.h[0]+'<br><span class="mut">🇷🇺 '+S.h[1]+'</span><div class="ex">💡 Example: '+S.h[2]+'</div></div>';
 S.q.forEach(function(q,k){
  var opts=S.fix?S.o:shuf(q[1]),ans=S.fix?S.o[q[1]]:q[1][0];
  h+='<div class="card"><div class="q">'+(k+1)+'. '+q[0]+'</div>'+opts.map(function(o){return'<button class="opt" data-a="'+(o===ans?1:0)+'">'+o+'</button>'}).join("")+'<div class="fb"></div></div>';
 });
 h+='<div class="how" id="ff" style="display:none">💡 Fun fact: '+S.f+'</div><button class="btn" id="nx" disabled>Next ▶</button>';
 app.innerHTML=h;window.scrollTo(0,0);
 var nx=document.getElementById("nx");
 document.querySelectorAll(".card").forEach(function(c){
  c.querySelectorAll(".opt").forEach(function(b){b.onclick=function(){
   if(c.dataset.d)return;c.dataset.d=1;done++;
   var right=b.dataset.a==="1";if(right)sc++;
   c.querySelectorAll(".opt").forEach(function(x){x.disabled=true;if(x.dataset.a==="1")x.classList.add("ok")});
   if(!right)b.classList.add("no");
   c.querySelector(".fb").textContent=right?"✅ Great!":"❌ Not quite — the correct answer is green.";
   if(done===S.q.length){document.getElementById("ff").style.display="block";nx.disabled=false;nx.textContent=si===SECS.length-1?"Finish 🏁":"Next ▶"}
  }});
 });
 nx.onclick=async function(){scores[si]=sc;nx.disabled=true;if(si===SECS.length-1){nx.textContent="Sending…";finish(await send())}else{si++;sec()}};
}
function finish(st8){
 var t=total(),p=t/MAX,st=p>=.9?"🌟🌟🌟":p>=.7?"🌟🌟":p>=.5?"🌟":"💪",code=mkCode();
 app.innerHTML='<div class="big">'+st+'</div><h1 style="text-align:center">Awesome, '+esc(name)+'!</h1>'+
 '<div class="card"><h2 style="text-align:center">'+t+' / '+MAX+'</h2><p class="mut" style="text-align:center;margin:0 0 8px">Grade: '+grade(t)+' / 10</p>'+SECS.map(function(s,i){return'<div>'+s.t+': <b>'+scores[i]+'/'+s.q.length+'</b></div>'}).join("")+'</div>'+
 (st8==="ok"?'<div class="card">✅ Your name and result were sent to your teacher.</div>':
 '<div class="card"><h2>📨 Send your result to the teacher</h2><p class="mut">Copy this code and send it to your teacher (or show them this screen).</p><textarea readonly id="cp">'+esc(code)+'</textarea><button class="btn" id="cpb">📋 Copy code</button></div>')+
 '<div class="card">🗣️ <b>Homework:</b> look at the diagram on page 38 and tell the class how we hear (Ex. 4). Start: “Sound travels in waves …”</div><button class="btn alt" id="ag">Play again 🔁</button>';
 document.getElementById("ag").onclick=home;confetti();
 var c=document.getElementById("cp"),cb=document.getElementById("cpb");if(c){c.onclick=function(){c.select()};cb.onclick=function(){c.select();var ok=function(){cb.textContent="✅ Copied!"};try{navigator.clipboard.writeText(c.value).then(ok,function(){try{document.execCommand("copy");ok()}catch(e){}})}catch(e){try{document.execCommand("copy");ok()}catch(_){}}}}
}
home();
</script>
</body>
</html>
